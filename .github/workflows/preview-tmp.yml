name: preview-tmp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: |
          cd out
          git init -q -b preview-build
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm build
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview-build
